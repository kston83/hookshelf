  # Terraform and Dockerfile misconfigurations (warns). checkov reads .checkov.yaml from
  # the repo root; delete `soft-fail: true` there to block.
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.4.3
    hooks:
      - id: checkov
        # The provider hook only runs when .tf files change. Also run it for tfvars,
        # Terraform JSON and Dockerfiles, and print findings even when it passes.
        files: \.(tf|tf\.json|tfvars)$|(^|/)(Dockerfile|Containerfile)[^/]*$|\.[dD]ockerfile$
        verbose: true
