  # Secrets (blocks). gitleaks checks staged changes on every commit.
  # gitleaks-history scans every commit; CI runs it with --hook-stage manual.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (all commits)
        entry: gitleaks git --redact --verbose
        stages: [manual]
