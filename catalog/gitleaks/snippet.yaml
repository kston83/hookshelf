  # Secrets (blocks). gitleaks reads .gitleaks.toml from the repo root.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # Scans the whole git history, not only staged changes. Runs only when asked:
      #   pre-commit run --all-files --hook-stage manual
      # In CI, check out the full history (not a shallow clone) first.
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]
