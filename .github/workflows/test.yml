name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    # Assembles .pre-commit-config.yaml from catalog/, runs real pre-commit on
    # tests/fixtures/ and checks each fixture passes or fails as expected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv reads .python-version (3.14) and installs that Python itself.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run --locked pytest -v
