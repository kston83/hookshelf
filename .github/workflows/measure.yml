name: measure installs

# How long each catalog tool's first pre-commit install takes on GitHub's runners.
# The tables land in each job's summary. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/measure_install.py
      - .github/workflows/measure.yml

permissions: {}

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: With Go installed (the runner has it)
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          echo "### $OS: with Go" >> "$GITHUB_STEP_SUMMARY"
          uv run scripts/measure_install.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Without Go (pre-commit downloads it)
        # Ubuntu's Go lives in /usr/bin next to git, so it can't be hidden from PATH.
        if: runner.os != 'Linux'
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          echo "### $OS: without Go" >> "$GITHUB_STEP_SUMMARY"
          uv run scripts/measure_install.py --without-go gitleaks tflint | tee -a "$GITHUB_STEP_SUMMARY"
